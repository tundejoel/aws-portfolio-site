name: Deploy portfolio site

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref}'

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::303927185686:role/github-actions-portfolio-deploy
          aws-region: us-east-1

      - name: Sync site to S3
        run: aws s3 sync . s3://adedayoafolabi.com --delete --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore" --exclude "README.md"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E32SHNM34F2D1F --paths "/*"